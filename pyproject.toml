[project]
name = "eyewright"
version = "0.3.1"
description = "eyewright - local decision core: three-eye gate + one-call typed decisions"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2"]

[project.scripts]
eyewright = "eyewright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyewright"]

[tool.hatch.build.targets.sdist]
# keep research data out of the source distribution (was ~1.2 MB of bench/*.jsonl)
exclude = ["bench"]

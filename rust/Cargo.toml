[package]
name = "eyewright"
version = "0.4.0"
edition = "2021"
rust-version = "1.99"
description = "eyewright - local decision core (Rust core slice)"

[[bin]]
name = "eyewright"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

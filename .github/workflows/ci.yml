name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade uv
      - run: uv sync --extra mcp
      - run: uv run python tests/test_version.py
      - run: uv run python tests/test_resilience.py
      - run: uv run python tests/test_auto_fallback.py
      - run: uv run python tests/test_generative.py
      - run: uv run python tests/test_security.py
      # tray/paths live in the package now; this guards the config resolution
      # and the drawn icon without needing a display.
      - run: uv run python -m eyewright.tray --check
      - run: uv build

  # The Rust port lives in rust/ and had no coverage at all, so it silently
  # carried the same two bugs the Python side had (#25, #26).
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --manifest-path rust/Cargo.toml
